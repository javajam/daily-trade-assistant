# 9/20 MA-cross — 10-share book with RSI14 < 60 entry filter (Book C).
#
# Same tape/rules as ema9_trend_bracket_rsi.example.yaml except the RSI
# threshold is 60 instead of 70.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket.example.yaml \
#     --compare-config config/ema9_trend_bracket_rsi.example.yaml \
#     --compare-config config/ema9_trend_bracket_rsi60.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_ma_cross_rsi.json \
#     --report artifacts/ema9_ma_cross_rsi.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "15m EMA(9) cross over SMA(20) only when RSI14 < 60. 10 shares. Flatten next open on EMA(9) cross under SMA(20). 1.5% stop; no take-profit; no break-even."
    when:
      ema_sma_cross:
        ema_period: 9
        sma_period: 20
        timeframe: 15m
        direction: bullish
      rsi: { period: 14, below: 60 }
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross
      ema_period: 9
      sma_period: 20
      stop_loss_pct: 1.5
