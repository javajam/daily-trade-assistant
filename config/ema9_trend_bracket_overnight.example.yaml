# 9 EMA trend — 10-share 1.5/3.0 bracket book with session gates OFF.
# Same entry/exit/size as ema9_trend_bracket.example.yaml so the overnight
# (prior) book can be compared to the gated product on the same tape.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_overnight.example.yaml \
#     --compare-config config/ema9_trend_bracket.example.yaml --source yahoo \
#     --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_session_gates.json \
#     --report artifacts/ema9_session_gates.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: null
  flatten_by: null

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Same 15m EMA9 trend + 1.5/3.0 brackets as the gated book, overnight holds allowed."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_loss_pct: 1.5
      take_profit_pct: 3.0
