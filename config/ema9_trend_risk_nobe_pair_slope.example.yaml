# Same as the 10-share pair-cross + SMA20 flat/rising book, 1% equity-risk.
#
# No live percent stop (exit is ma_cross_close / session_flatten). Share count
# uses a reference R of 1% of entry price so sizing stays comparable to the
# locked MA-cross-at-close 1% risk book:
#   shares = floor((0.01 * equity) / (0.01 * price))
# Fill at the next bar open.
# Writeup: artifacts/ema9_pair_slope.md
#
#   python -m dta_bot backtest --config config/ema9_trend_risk.example.yaml \
#     --compare-config config/ema9_trend_risk_nobe_pair_slope.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 --combined-only \
#     --symbols AAPL,MSFT \
#     --output artifacts/ema9_aug2026_risk_pair_slope.json \
#     --report artifacts/ema9_aug2026_risk_pair_slope.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book risk: 15m EMA(9)×above SMA(20) close-to-close while SMA20 is flat or rising. 1% equity risk sized off a 1.0% reference R (no live percent stop); EMA9×below SMA20 exit at that bar's close. Fill next bar open. No RSI / no price×EMA9."
    when:
      all:
        - ema_sma_cross:
            ema_period: 9
            sma_period: 20
            timeframe: 15m
            direction: bullish
        - sma_slope:
            period: 20
            timeframe: 15m
            compare: flat_or_rising
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.0
      order: market
      exit: ma_cross_close
      exit_ema_period: 9
      exit_sma_period: 20
