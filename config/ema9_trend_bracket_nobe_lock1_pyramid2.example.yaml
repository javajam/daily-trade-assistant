# Noon EMA9 long-only AAPL+MSFT: lock-+1% plus pyramid-on-lock and a 2% fill take.
#
# Same entry / gates as the lock-+1% default
# (config/ema9_trend_bracket_nobe_lock1.example.yaml). Additive changes only:
#   1. When the +1% lock arms, add the same share count as the open lot
#      (double total shares). Add fill: bar open if it gaps through
#      original fill × 1.01, else the trigger (high tagged it).
#   2. After lock, stop stays at original fill × 1.01 on the full position.
#   3. Take the entire position at original fill × 1.02 (take_anchor: entry).
#   4. Session flatten if neither stop nor 2% take hits.
# Cash for the add is not reserved at entry. No volume filter. No second-signal
# pyramid (allow_pyramid stays off). Live does not auto-add on lock.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_nobe_lock1.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_lock1_pyramid2.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_lock1_pyramid2.json \
#     --report artifacts/ema9_lock1_pyramid2.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book B pyramid: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, lock stop to +1% on first touch of entry×1.01, add the same lot at the lock-arm print, take the full position at entry×1.02."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_mode: lock_plus
      stop_loss_pct: 1.0
      lock_trigger_pct: 1.0
      lock_stop_pct: 1.0
      pyramid_on_lock: true
      take_anchor: entry
      take_profit_pct: 2.0
