# Prior noon day-trade book — old entry, SMA(20) stop, no percent take.
#
# Same as config/ema9_trend_bracket_sma20.example.yaml except take_profit_pct
# is omitted. Exits are SMA20 stop, session flatten (15:55), or eod.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_sma20.example.yaml \
#     --compare-config config/ema9_trend_bracket_sma20_notake.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Prior noon book: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, SMA20 signal-bar stop, no percent take, no break-even."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_mode: sma20
      stop_sma_period: 20
