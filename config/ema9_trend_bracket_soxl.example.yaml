# 9 EMA trend — 10-share 1.5/3.0 bracket book with SOXL on the 12:00 / 15:55
# session gates. Same locked entry/exit as ema9_trend_bracket.example.yaml.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_soxl.example.yaml \
#     --source yahoo --breakout SOXL \
#     --output artifacts/ema9_session_gates_soxl.json \
#     --report artifacts/ema9_session_gates_soxl.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT
  - SOXL

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT, SOXL]
    cooldown_minutes: 60
    notes: "Same 15m EMA9 trend + 1.5/3.0 brackets as the gated book, plus SOXL."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_loss_pct: 1.5
      take_profit_pct: 3.0
