# 9/20 MA-cross — 10-share book with SOXL added (optional universe).
# Same pair-cross entry/exit as config/ema9_trend_pair.example.yaml.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_soxl.example.yaml \
#     --source yahoo --breakout SOXL \
#     --output artifacts/ema9_session_gates_soxl.json \
#     --report artifacts/ema9_session_gates_soxl.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT
  - SOXL

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT, SOXL]
    cooldown_minutes: 60
    notes: "Same 15m EMA(9)/SMA(20) cross as the gated book, plus SOXL. 1.5% stop; no take-profit; no break-even."
    when:
      ema_sma_cross:
        ema_period: 9
        sma_period: 20
        timeframe: 15m
        direction: bullish
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross
      ema_period: 9
      sma_period: 20
      stop_loss_pct: 1.5
