# 1% equity-risk sibling of lock-+1% + pyramid + 2% fill take.
#
# Same entry / session / lock / add / take as
# config/ema9_trend_bracket_nobe_lock1_pyramid2.example.yaml.
# Size the *initial* lot from 1% of equity vs the 1.0% stop distance
# (shares = floor((0.01 * equity) / (0.01 * price)) ≈ 100% of equity).
# The add doubles that lot. Cash for the add is not reserved at entry —
# after a full-sized initial lot the add typically skips (insufficient cash);
# lock still arms and the 2% fill take remains on the original lot.
#
#   python -m dta_bot backtest --config config/ema9_trend_risk_nobe_lock1.example.yaml \
#     --compare-config config/ema9_trend_risk_nobe_lock1_pyramid2.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_aug2026_risk_lock1_pyramid2.json \
#     --report artifacts/ema9_aug2026_risk_lock1_pyramid2.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book B risk pyramid: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 1% equity risk at a 1.0% fill stop for the initial lot; add the same lot at lock-arm if cash covers it; take the full position at entry×1.02."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.0
      order: market
      exit: fixed_bracket
      stop_mode: lock_plus
      stop_loss_pct: 1.0
      lock_trigger_pct: 1.0
      lock_stop_pct: 1.0
      pyramid_on_lock: true
      take_anchor: entry
      take_profit_pct: 2.0
