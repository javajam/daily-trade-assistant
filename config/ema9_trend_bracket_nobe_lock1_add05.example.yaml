# Noon EMA9 long-only AAPL+MSFT: add at +0.5%, then lock-+1%. No take.
#
# Same entry / gates as the lock-+1% default
# (config/ema9_trend_bracket_nobe_lock1.example.yaml). Additive changes only:
#   1. Initial stop = fill × 0.99.
#   2. When price first reaches original fill × 1.005, add the same share
#      count as the open lot. Add fill: bar open if it gaps through that
#      trigger, else the trigger (high tagged it).
#   3. When price first reaches original fill × 1.01, lock the stop there
#      on the full (doubled) position — same lock-+1% as baseline, after
#      the add. Locked stop is live from the next bar.
#   4. If a bar gaps through +1% with no earlier +0.5% print, add first
#      (at open if open ≥ 1.005, else at 1.005) then lock.
#   5. No hard take-profit. Exits = stop / lock_stop / session_flatten.
# Cash for the add is not reserved at entry. No volume filter.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_nobe_lock1.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_lock1_add05.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_lock1_add05.json \
#     --report artifacts/ema9_lock1_add05.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book B add@0.5: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, add the same lot at entry×1.005, lock stop to +1% on the full position, no take."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_mode: lock_plus
      stop_loss_pct: 1.0
      lock_trigger_pct: 1.0
      lock_stop_pct: 1.0
      pyramid_add_pct: 0.5
