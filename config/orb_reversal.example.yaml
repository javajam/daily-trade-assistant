# ORB (opening-range) edge-fade / reversal — paper defaults.
# Copy to config/orb_reversal.yaml to customize. Do not enable live by accident.
#
# Strategy (locked v1)
# --------------------
# 1. Opening range = first orb_timeframe candle at/after session_open
#    (default 15m → 9:30–9:45 America/New_York high/low).
# 2. After that candle is fully formed, evaluate signal_timeframe bars (default 5m).
# 3. Probe (probe_mode: touch_and_band, default): the signal bar must *touch*
#    the OR edge AND *close* inside the edge band.
#      band = edge_pct * (or_high - or_low)  (0.05 = 5% of OR height)
#      top (potential short):  high >= or_high  AND close in [or_high - band, or_high]
#      bottom (potential long): low  <= or_low  AND close in [or_low, or_low + band]
#    probe_mode: touch is wick-only (close-in-band not required).
#    probe_mode: edge_band restores the previous close-in-zone rule (no touch).
# 4. Reversal = the next signal bar, opposite color:
#      top probe + bearish close  → short
#      bottom probe + bullish close → long
#    reversal_in_range: close (default) also requires
#      or_low <= close <= or_high. If the reversal closes outside the OR,
#      do not enter. body = high and low both inside the OR (stricter
#      fully-inside mode). off = no in-range filter.
# 5. EMA filter (ema_filter: true, ema_period: 9, default):
#      compute EMA(period) on signal_timeframe closes through the
#      reversal bar (inclusive). Long: close > ema; short: close < ema.
#      ema_require_open: false (default) compares close only; set true
#      to also require the reversal open on the same side of the EMA.
#      If EMA cannot be computed (not enough closes), skip the entry.
# 6. Entry fills at the open of the bar after the reversal (one bar later).
# 7. Stop (stop_mode: orb_extreme, default):
#      long  → opening-range low  (bottom of the range)
#      short → opening-range high (top of the range)
#    Previous behavior is stop_mode: reversal_candle (reversal low/high).
# 8. Take profit (take_profit_mode: ema_cross, default):
#      exit at the close of the first signal-timeframe bar after
#      entry whose close is on the other side of the same EMA used
#      by the entry filter. Long: close < ema; short: close > ema.
#      or_midpoint is (or_high + or_low) / 2. one_r is 1R from entry
#      (R = |entry − stop|; long TP = entry + R; short TP = entry − R).
#      first_profitable_close exits at the close of the first
#      signal-timeframe bar that is strictly profitable vs entry
#      (long: close > entry; short: close < entry). If stop and take
#      (EMA-cross, 1R, midpoint, or first-profit) both trade on the
#      same bar, the stop fills first.
# 9. High-vol gate (min_or_height_pct: 0.01, default = 1%):
#      trade only when (or_high - or_low) / or_open >= min_or_height_pct.
#      Denominator is the OR candle's open; if that print is missing,
#      fall back to the OR midpoint. Below the threshold, skip the
#      symbol for that session (no entries). Set 0 / null to disable.
# 10. Frequency (defaults aimed at fewer late/choppy trades):
#      entry_cutoff: "10:30"          # session timezone (America/New_York)
#      max_trades_before_cutoff: 1    # per symbol per session
#      allow_entries_after_cutoff: false
#    Meaning: at most one entry per symbol, and only if that entry's fill
#    time is strictly before 10:30 ET. No new entries at/after 10:30.
#    Set allow_entries_after_cutoff: true to still take post-10:30 signals
#    after the one morning slot is used (or instead, if the first setup
#    is late). Set entry_cutoff: null to disable the clock gate.
#    One open position per symbol (no pyramiding). Default is skip new
#    entries while already in a position; set on_open_position: replace
#    to close/replace on a new signal.
# 11. Universe is fully configurable below. A morning screener will populate
#    this list later — edit it by hand for now.

strategy: orb_reversal

settings:
  paper: true
  allow_live: false          # keep false
  dry_run: true              # log decisions; do not submit (override with --live-orders)
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/orb_state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 200         # a full RTH day of 5m bars is 78 prints

# Fully configurable symbol list. A morning screener will populate this later.
universe:
  - AAPL
  - MSFT
  - SPY
  - SOXL

orb:
  session_open: "09:30"
  session_close: "16:00"           # do not probe after RTH
  session_timezone: America/New_York
  orb_timeframe: 15m               # 5m / 15m / 30m — switch without code changes
  signal_timeframe: 5m
  probe_mode: touch_and_band       # touch_and_band | touch | edge_band
  edge_pct: 0.05                   # used by touch_and_band / edge_band; fraction of OR height (0.05 = 5%)
  on_open_position: skip           # skip | replace
  reversal_in_range: close         # close | body | off  (body = high+low inside OR)
  take_profit_mode: ema_cross      # ema_cross | or_midpoint | one_r | first_profitable_close
  ema_filter: true                 # reversal close vs EMA(ema_period) on signal TF
  ema_period: 9
  ema_require_open: false          # also require open on the same side of the EMA
  stop_mode: orb_extreme           # orb_extreme | reversal_candle
  min_or_height_pct: 0.01          # 1% of OR open; 0 / null disables the high-vol gate
  entry_cutoff: "10:30"            # no new entries at/after this clock (ET)
  max_trades_before_cutoff: 1      # per symbol per session before the cutoff
  allow_entries_after_cutoff: false
  cooldown_minutes: 0              # extra pause after a fire; 0 = off

sizing:
  type: shares                     # shares | percent_equity
  value: 10

order:
  type: market                     # market | limit
  time_in_force: day
  # limit_offset_pct: 0.05
