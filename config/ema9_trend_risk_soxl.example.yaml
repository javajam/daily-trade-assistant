# 9/20 MA-cross — 1% risk book with SOXL included (optional universe).
#
# Same pair-cross as config/ema9_trend_risk_pair.example.yaml plus SOXL.
#
#   python -m dta_bot backtest --config config/ema9_trend_risk_soxl.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 --breakout SOXL \
#     --output artifacts/ema9_aug2026_risk_soxl.json \
#     --report artifacts/ema9_aug2026_risk_soxl.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT
  - SOXL

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT, SOXL]
    cooldown_minutes: 60
    notes: "15m EMA(9) cross over SMA(20). 1% equity risk at a 1.5% stop. Flatten next open on cross-under. Includes SOXL."
    when:
      ema_sma_cross:
        ema_period: 9
        sma_period: 20
        timeframe: 15m
        direction: bullish
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.5
      order: market
      exit: ma_cross
      ema_period: 9
      sma_period: 20
      stop_loss_pct: 1.5
