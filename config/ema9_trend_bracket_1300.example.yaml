# 9/20 MA-cross — 10-share book with the prior 13:00 entry cutoff.
# Same flatten_by 15:55 as the current product. Used as a gate comparison.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_overnight.example.yaml \
#     --compare-config config/ema9_trend_bracket_1300.example.yaml \
#     --compare-config config/ema9_trend_bracket.example.yaml --source yahoo \
#     --combined-only --symbols AAPL,MSFT

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "13:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Same 15m EMA(9)/SMA(20) cross as the gated book, 13:00 ET cutoff."
    when:
      ema_sma_cross:
        ema_period: 9
        sma_period: 20
        timeframe: 15m
        direction: bullish
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross
      ema_period: 9
      sma_period: 20
      stop_loss_pct: 1.5
