# Prior default / comparison — lock-+1% (not the locked day-trade book).
#
# Default product is now range>last-3: config/ema9_trend.example.yaml
# Writeup: artifacts/ema9_range3_adopted.md
# Prior MA-cross at close: config/ema9_trend_bracket_nobe_macross.example.yaml
#
# Named sibling so A/B/C stop-manage compares stay explicit:
#   A fixed 1%: config/ema9_trend_bracket_nobe_fixed1.example.yaml
#   B lock +1% (this file; prior default)
#   C trail 1%: config/ema9_trend_bracket_nobe_trail1.example.yaml
# Stop (stop_mode: lock_plus):
#   initial stop = fill × 0.99
#   first trade/touch of fill × 1.01 (bar high ≥ trigger) moves the stop to
#   fill × 1.01 and leaves it. Locked stop is live from the next bar.
# No take-profit. Exits = stop / lock_stop / session_flatten.
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_nobe_fixed1.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_lock1.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_trail1.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_stop_manage.json \
#     --report artifacts/ema9_stop_manage.md
#
# Lower-high + vol>prev sibling (no lock-+1%): 
#   config/ema9_trend_bracket_nobe_lh_vol.example.yaml
#   writeup: artifacts/ema9_lh_vol.md
# Lock-+1% + vol>prev only (same exit): 
#   config/ema9_trend_bracket_nobe_lock1_vol.example.yaml
#   writeup: artifacts/ema9_lock1_vol.md
# Lock-+1% + pyramid + 2% fill take:
#   config/ema9_trend_bracket_nobe_lock1_pyramid2.example.yaml
#   writeup: artifacts/ema9_lock1_pyramid2.md
# Lock-+1% + add at +0.5% (no take):
#   config/ema9_trend_bracket_nobe_lock1_add05.example.yaml
#   writeup: artifacts/ema9_lock1_add05.md
# MA-cross at close (no lock-+1% / no % stop; EMA9×below SMA20 at that close):
#   config/ema9_trend_bracket_nobe_macross.example.yaml
#   writeup: artifacts/ema9_lock1_macross.md
# Lock-+1% + MA-cross at close (both exits live; first hit wins):
#   config/ema9_trend_bracket_nobe_lock1_macross.example.yaml
#   writeup: artifacts/ema9_lock1_plus_macross.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book B: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, lock stop to +1% on first touch of entry×1.01, no take."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_mode: lock_plus
      stop_loss_pct: 1.0
      lock_trigger_pct: 1.0
      lock_stop_pct: 1.0
