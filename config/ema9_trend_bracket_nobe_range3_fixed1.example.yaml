# Named copy of the locked day-trade book (config/ema9_trend.example.yaml).
#
# Hard 1% fill stop + range > last 3. The stop never moves — this is not
# lock_plus. No lock-at-+1%. No half-take. No pyramid. No volume filter.
# No MA-cross.
#
# Exits (whichever first):
#   1. Hard stop: bar low ≤ fill × 0.99 (gap-through fills at that bar's open).
#   2. range_expansion: completed bar *after the entry/fill bar* has range
#      (high − low) strictly greater than max of the previous 3; fill at
#      that close.
#   3. session_flatten at 15:55 (15:45 ET 15m bar close).
# Same-bar stop + range expansion → stop (stop is checked first). Flatten-bar
# expansion with no stop hit → range_expansion at that close over
# session_flatten. Fill at the next bar open (same as the locked book).
# Writeup: artifacts/ema9_range3_fixed1.md
#
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_range3_fixed1.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_range3_fixed1.json \
#     --report artifacts/ema9_range3_fixed1.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book: 15m price crosses above EMA(9) while above SMA20 and RSI < 70. 10 shares, hard 1% fill stop plus exit when bar range > max of previous 3, fill at that close. Not lock_plus."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: range_expansion
      exit_range_bars: 3
      stop_mode: entry_pct
      stop_loss_pct: 1.0
