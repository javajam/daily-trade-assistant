# 9/20 MA-cross — 1% equity-risk book with RSI14 < 70 entry filter.
#
# Same locked product as ema9_trend_risk.example.yaml except the entry
# also requires RSI(14) on the signal 15m bar to be below 70.
#
#   python -m dta_bot backtest --config config/ema9_trend_risk.example.yaml \
#     --compare-config config/ema9_trend_risk_rsi.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 --combined-only \
#     --output artifacts/ema9_aug2026_risk_rsi.json \
#     --report artifacts/ema9_aug2026_risk_rsi.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "15m EMA(9) cross over SMA(20) only when RSI14 < 70. 1% equity risk at a 1.5% stop. Flatten next open on EMA(9) cross under SMA(20). No take-profit; no break-even."
    when:
      ema_sma_cross:
        ema_period: 9
        sma_period: 20
        timeframe: 15m
        direction: bullish
      rsi: { period: 14, below: 70 }
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.5
      order: market
      exit: ma_cross
      ema_period: 9
      sma_period: 20
      stop_loss_pct: 1.5
