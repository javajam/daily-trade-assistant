# Refined EMA9 day-trade — 1% equity-risk on 5-minute bars.
#
# Same noon long-only range-expansion + live 1% fill stop as
# config/ema9_trend_risk.example.yaml. 1% equity risk at that matching 1.0% R.
# every indicator on 5m. flatten_by 15:55 ET maps to the 15:50 ET 5m bar close.
# Cooldown stays 60 wall-clock minutes.
#
#   python -m dta_bot backtest --config config/ema9_trend_risk.example.yaml \
#     --compare-config config/ema9_trend_risk_5m.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 --combined-only \
#     --symbols AAPL,MSFT
#
# Equivalent: --config config/ema9_trend_risk.example.yaml --timeframe 5m

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 5m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book risk: 5m price crosses above EMA(9) while above SMA20 and RSI < 70. 1% equity risk at a live 1.0% fill stop; also exit when bar range > max of previous 3, fill at that close. Not lock_plus."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 5m
            direction: bullish
        - sma:
            period: 20
            timeframe: 5m
            compare: above
        - rsi:
            period: 14
            timeframe: 5m
            below: 70
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.0
      order: market
      exit: range_expansion
      exit_range_bars: 3
      stop_mode: entry_pct
      stop_loss_pct: 1.0
