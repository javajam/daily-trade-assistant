# Refined EMA9 day-trade — 1% equity-risk book, long-only range expansion.
#
# Same noon stack as config/ema9_trend.example.yaml (AAPL / MSFT).
# Long: RSI(14) < 70, range>last-3 at that bar's close, size 1% equity
# risk at a 1.0% reference R (no live percent stop):
#   shares = floor( (0.01 * equity) / (0.01 * entry_price) )
# No MA-cross / lock_plus / half-take / pyramid / volume filter. Session
# gates on (toggle to null / off). Both names may be open at once when cash
# covers the second notional; otherwise the later signal is skipped.
# Writeup: artifacts/ema9_range3_adopted.md
#
# Named copy of this default: config/ema9_trend_risk_nobe_range3.example.yaml
# Prior MA-cross at close (same entry / session):
#   config/ema9_trend_risk_nobe_macross.example.yaml
# Prior lock-+1% 1% risk comparison:
#   config/ema9_trend_risk_nobe_lock1.example.yaml
# Optional stop siblings: config/ema9_trend_risk_nobe_fixed1.example.yaml
# and config/ema9_trend_risk_nobe_trail1.example.yaml.
# TSLA / MU 1% sibling: config/ema9_trend_risk_tsla_mu.example.yaml
# SPY / QQQ long-only 1% sibling: config/ema9_trend_risk_spy_qqq.example.yaml
# NVDA / AMD long-only 1% sibling: config/ema9_trend_risk_nvda_amd.example.yaml
# AAPL / MSFT / META long-only 1% add-on: config/ema9_trend_risk_aapl_msft_meta.example.yaml
# Prior pair-cross 1% book: config/ema9_trend_risk_pair.example.yaml
#
#   python -m dta_bot validate --config config/ema9_trend_risk.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend_risk.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 --combined-only \
#     --output artifacts/ema9_aug2026_risk.json \
#     --report artifacts/ema9_aug2026_risk.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book risk: 15m price crosses above EMA(9) while above SMA20 and RSI < 70. 1% equity risk sized off a 1.0% reference R (no live percent stop); exit when bar range > max of previous 3, fill at that close."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.0
      order: market
      exit: range_expansion
      exit_range_bars: 3
