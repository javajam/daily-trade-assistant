# 9/20 MA-cross — 1% equity-risk book (paper / dry_run).
#
# Locked product:
#   - 15m EMA(9) crosses over SMA(20) (long only)
#   - exit: ma_cross — flatten at next bar open when EMA(9) crosses under SMA(20)
#   - stop: 1.5% initial only (break-even off; no take-profit)
#   - universe: AAPL + MSFT (no SOXL)
#   - size: risk ~1% of current equity at the 1.5% stop
#       shares = floor( (0.01 * equity) / (0.015 * entry_price) )
#              = floor( equity / (1.5 * entry_price) )
#   - session gates (America/New_York) — toggle either to null / off:
#       entry_cutoff: "12:00"
#       flatten_by: "15:55"
#
#   python -m dta_bot validate --config config/ema9_trend_risk.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend_risk.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 --combined-only \
#     --output artifacts/ema9_aug2026_risk.json \
#     --report artifacts/ema9_aug2026_risk.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "15m EMA(9) cross over SMA(20). 1% equity risk at a 1.5% stop. Flatten next open on EMA(9) cross under SMA(20). No take-profit; no break-even."
    when:
      ema_sma_cross:
        ema_period: 9
        sma_period: 20
        timeframe: 15m
        direction: bullish
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.5
      order: market
      exit: ma_cross
      ema_period: 9
      sma_period: 20
      stop_loss_pct: 1.5
