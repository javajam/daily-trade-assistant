# Refined EMA9 day-trade — 1% equity-risk book, long + mirrored short.
#
# Same noon stack as config/ema9_trend.example.yaml (AAPL / MSFT).
# Long: RSI(14) < 70, lock-+1%, size 1% equity risk at the 1.0% fill stop
#   shares = floor( (0.01 * equity) / (0.01 * entry_price) )
# Short: no RSI; cover on EMA(9) over SMA(20) (next bar open) or session
# flatten. No percent / lock_plus stop, so no R — shorts stay 10 shares
# (1% risk sizing is not defined without a stop).
# One position per symbol (long or short). Opposite signal while in a trade
# is skipped (opposite_signal_in_trade). Disable a side with enabled: false.
# No fixed take-profit. Session gates on (toggle to null / off).
# Optional stop siblings: config/ema9_trend_risk_nobe_fixed1.example.yaml
# and config/ema9_trend_risk_nobe_trail1.example.yaml.
# TSLA / MU 1% sibling: config/ema9_trend_risk_tsla_mu.example.yaml
# Prior pair-cross 1% book: config/ema9_trend_risk_pair.example.yaml
#
#   python -m dta_bot validate --config config/ema9_trend_risk.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend_risk.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 --combined-only \
#     --output artifacts/ema9_aug2026_risk.json \
#     --report artifacts/ema9_aug2026_risk.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon long: 15m price crosses above EMA(9) while above SMA20 and RSI < 70. 1% equity risk at a 1.0% fill stop; lock to +1% on first touch of entry×1.01; no take."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.0
      order: market
      exit: fixed_bracket
      stop_mode: lock_plus
      stop_loss_pct: 1.0
      lock_trigger_pct: 1.0
      lock_stop_pct: 1.0
  - id: ema9_trend_short
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon short: 15m price crosses below EMA(9) while below SMA20 (no RSI). Cover when EMA(9) crosses above SMA(20) at the next open. 10 shares (no stop R, so not 1% risk-sized). No percent / lock_plus stop."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bearish
        - sma:
            period: 20
            timeframe: 15m
            compare: below
    action:
      type: sell
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross
      exit_ema_period: 9
      exit_sma_period: 20
