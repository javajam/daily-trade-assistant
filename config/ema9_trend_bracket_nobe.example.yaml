# Prior noon day-trade book — 1.5/3.0 brackets, preserved for comparison.
#
# Same entry as the current product (price×EMA9 + SMA20 + RSI14 < 70) but
# with 1.5/3.0 percent brackets from the signal close, not lock-+1%.
# Current product: config/ema9_trend.example.yaml (lock_plus, no take).
# Tight 1.0/2.0 sibling (same old entry, no BE):
#   config/ema9_trend_bracket_nobe_12.example.yaml
# August 1% risk restore (same old entry, 1.5/3.0, no BE):
#   config/ema9_trend_risk_nobe.example.yaml
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_nobe.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_12.example.yaml --source yahoo \
#     --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_brackets_12_vs_153.json \
#     --report artifacts/ema9_brackets_12_vs_153.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Prior noon book: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, 1.5/3.0 brackets, no break-even."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_loss_pct: 1.5
      take_profit_pct: 3.0
