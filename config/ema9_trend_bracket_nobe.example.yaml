# Prior noon day-trade book — old entry, preserved for comparison.
#
# This is *not* the current product. It keeps the previous 12:00 / 15:55
# 10-share book: price crosses EMA(9) while close > SMA(20) and RSI14 < 70,
# 1.5/3.0 fixed brackets, no break-even. Use it only to replay the old
# noon day-trade numbers against the new EMA(9)/SMA(20) pair-cross book.
#
# Current product: config/ema9_trend_bracket.example.yaml
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_nobe.example.yaml \
#     --compare-config config/ema9_trend_bracket.example.yaml --source yahoo \
#     --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_ma_cross.json \
#     --report artifacts/ema9_ma_cross.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Prior noon book: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, 1.5/3.0 brackets, no break-even."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_loss_pct: 1.5
      take_profit_pct: 3.0
