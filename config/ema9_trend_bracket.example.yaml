# Refined EMA9 day-trade — 10-share book (same as ema9_trend.example.yaml).
#
# Default product: price crosses EMA(9) while close > SMA(20) and RSI14 < 70,
# EMA9×below SMA20 exit at that bar's close, no lock / no percent stop,
# session gates on. Writeup: artifacts/ema9_macross_adopted.md
#
# Prior lock-+1% comparison: config/ema9_trend_bracket_nobe_lock1.example.yaml
# Optional stop siblings: fixed 1% / trail 1% (nobe_fixed1 / nobe_trail1).
# Prior pair-cross 10-share: config/ema9_trend_pair.example.yaml
#
# AAPL / MSFT / META 10-share add-on: config/ema9_trend_aapl_msft_meta.example.yaml
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_nobe_fixed1.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_lock1.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_trail1.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_stop_manage.json \
#     --report artifacts/ema9_stop_manage.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, EMA9×below SMA20 exit at that bar's close, no percent stop."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross_close
      exit_ema_period: 9
      exit_sma_period: 20
