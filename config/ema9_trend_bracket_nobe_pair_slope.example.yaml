# Noon EMA9 long-only AAPL+MSFT: pair-cross entry + SMA20 flat/rising.
#
# Same exit, gates, and universe as the locked day-trade book
# (config/ema9_trend.example.yaml / ema9_trend_bracket_nobe_macross):
# EMA9×below SMA20 at that bar's close (action.exit: ma_cross_close).
# No RSI. No price-cross-above-EMA9. No lock-+1% / percent stop / half-take /
# pyramid / volume filter.
#
# Entry (signal bar):
#   1. EMA(9) crosses above SMA(20) close-to-close
#      (prev EMA <= prev SMA and curr EMA > curr SMA — inverse of the
#      ma_cross_close exit convention).
#   2. SMA(20) flat or rising: SMA20[curr] >= SMA20[prev].
# Fill at the next bar open (same as the locked book).
# Writeup: artifacts/ema9_pair_slope.md
#
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_pair_slope.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_pair_slope.json \
#     --report artifacts/ema9_pair_slope.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book: 15m EMA(9)×above SMA(20) close-to-close while SMA20 is flat or rising. 10 shares, EMA9×below SMA20 exit at that bar's close. Fill next bar open. No RSI / no price×EMA9."
    when:
      all:
        - ema_sma_cross:
            ema_period: 9
            sma_period: 20
            timeframe: 15m
            direction: bullish
        - sma_slope:
            period: 20
            timeframe: 15m
            compare: flat_or_rising
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross_close
      exit_ema_period: 9
      exit_sma_period: 20
