# Prior noon day-trade book — old entry, 1.0/2.0 brackets.
#
# Same locked stack as config/ema9_trend_bracket_nobe.example.yaml except
# stop 1.0% / take 2.0% (still no break-even). Entry is the older
# price×EMA(9) cross (NOT the EMA9/SMA20 pair-cross product):
#   close crosses above EMA(9) AND close > SMA(20) AND RSI14 < 70
#
# Control (1.5/3.0): config/ema9_trend_bracket_nobe.example.yaml
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_nobe.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_12.example.yaml --source yahoo \
#     --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_brackets_12_vs_153.json \
#     --report artifacts/ema9_brackets_12_vs_153.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Prior noon book: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, 1.0/2.0 brackets, no break-even."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_loss_pct: 1.0
      take_profit_pct: 2.0
