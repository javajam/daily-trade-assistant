# Prior noon day-trade book — old entry, SMA(20) stop + 2.0% take.
#
# Same locked stack as config/ema9_trend_bracket_nobe_12.example.yaml except
# the protective stop is SMA(20) at the signal bar (fixed level, stop_mode:
# sma20) instead of a 1.0% stop. 10 shares, 2.0% take, no break-even.
# Longs skip when SMA20 is at/above the signal close or the next-bar fill.
#
# Control (1.0/2.0 percent): config/ema9_trend_bracket_nobe_12.example.yaml
# No-take sibling: config/ema9_trend_bracket_sma20_notake.example.yaml
#
#   python -m dta_bot backtest --config config/ema9_trend_bracket_nobe_12.example.yaml \
#     --compare-config config/ema9_trend_bracket_sma20.example.yaml \
#     --compare-config config/ema9_trend_bracket_sma20_notake.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_sma20_stop.json \
#     --report artifacts/ema9_sma20_stop.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Prior noon book: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, SMA20 signal-bar stop, 2.0% take, no break-even."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_mode: sma20
      stop_sma_period: 20
      take_profit_pct: 2.0
