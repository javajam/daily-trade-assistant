# Prior noon day-trade book — old entry, 1% equity-risk, 1.5/3.0 brackets.
#
# Restored price×EMA(9) risk YAML (the pair-cross product replaced
# config/ema9_trend_risk.example.yaml). Same entry as
# config/ema9_trend_bracket_nobe.example.yaml, no break-even:
#   close crosses above EMA(9) AND close > SMA(20) AND RSI14 < 70
# Size: risk 1% of current equity at the 1.5% stop (stop_pct must match).
#
# Tight sibling: config/ema9_trend_risk_nobe_12.example.yaml (1.0/2.0).
#
#   python -m dta_bot backtest --config config/ema9_trend_risk_nobe.example.yaml \
#     --compare-config config/ema9_trend_risk_nobe_12.example.yaml --source yahoo \
#     --start 2026-08-01 --end 2026-08-31 --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_aug2026_risk_brackets.json \
#     --report artifacts/ema9_aug2026_risk_brackets.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Prior noon book: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 1% equity risk at a 1.5% stop; 3.0% take. No break-even."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
        stop_pct: 1.5
      order: market
      exit: fixed_bracket
      stop_loss_pct: 1.5
      take_profit_pct: 3.0
