# 9/20 MA-cross — long-only (paper / dry_run).
#
# Universe AAPL / MSFT (SOXL is optional: config/ema9_trend_bracket_soxl.example.yaml
# and config/ema9_trend_risk_soxl.example.yaml). Clean pair-cross:
#
#   Entry: EMA(9) crosses over SMA(20) on the signal timeframe
#          (prev EMA9 <= prev SMA20 and curr EMA9 > curr SMA20).
#   Exit:  EMA(9) crosses under SMA(20); flatten at the *next bar open*
#          (same fill as entries). Same-bar 1.5% stop still wins.
#   Stop:  fixed 1.5% initial stop only. Break-even is off (omit /
#          breakeven_after_bars: 0). No take-profit.
#
# Session gates (America/New_York) — toggle either to null / off:
#   entry_cutoff: "12:00"   # skip fills at/after this clock; null = off
#   flatten_by: "15:55"     # force-flat at flatten-bar close; null = off
# Overnight control: config/ema9_trend_bracket_overnight.example.yaml
# Prior noon price-cross book (old entry): config/ema9_trend_bracket_nobe.example.yaml
#
# Bar size is settings.timeframe (or --timeframe). Default 15m. Same book on 5m:
#
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml --timeframe 5m
#   # or: config/ema9_trend_5m.example.yaml
#
#   python -m dta_bot validate --config config/ema9_trend.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml --source yahoo \
#     --output artifacts/ema9_ma_cross.json \
#     --report artifacts/ema9_ma_cross.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "15m EMA(9) cross over SMA(20). Flatten next bar open on EMA(9) cross under SMA(20). 1.5% stop; no take-profit; no break-even."
    when:
      ema_sma_cross:
        ema_period: 9
        sma_period: 20
        timeframe: 15m
        direction: bullish
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross
      ema_period: 9
      sma_period: 20
      stop_loss_pct: 1.5
