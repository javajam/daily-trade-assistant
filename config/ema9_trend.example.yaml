# 9 EMA trend — long-only v1 (paper / dry_run).
#
# Universe AAPL / MSFT / SOXL. Entry is unchanged: bullish close-across-EMA(9)
# plus close > SMA20 and RSI14 < 70. Default exit for this experiment is
# EMA-invalidation — hold until a signal-timeframe bar closes < EMA(9)
# (equals EMA stays valid) and flatten at that close. No 1.5/3.0 bracket.
# Optional stop_loss_pct is a catastrophic stop only (omit / leave unset = off).
#
#   action.exit: ema_invalid     # this file's default
#   action.exit: fixed_bracket   # restore percent stop/take (set stop_loss_pct / take_profit_pct)
#
# Session gates (America/New_York): no new fills at/after 15:15; force-flat at
# the 15:45 ET 15m bar close (last regular 15m bar, aligned with flatten_by 15:55).
# Set entry_cutoff / flatten_by to null to restore overnight holds.
#
# Bar size is parameterized: settings.timeframe (or --timeframe on the CLI)
# rewrites every condition. Default here is 15m. Same book on 5m:
#
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml --timeframe 5m
#   # or: config/ema9_trend_5m.example.yaml
#
# Cross definition (engine MaCrossCond): previous close <= previous EMA9 and
# current close > current EMA9, evaluated only when the trend filter is true
# on that same bar (all indicators use the chosen timeframe).
#
# This file also ships:
#   - ema9_cross_raw — same cross and EMA-invalid exit, no SMA/RSI filter (ablation)
#   - engulfing-with-trend — control book on the same tape (still 1.5/3.0 brackets)
# Isolated backtest books stay separate (one lot per symbol per book).
# Copy to config/ema9_trend.yaml (gitignored) and disable unused rules to paper-trade.
#
#   python -m dta_bot validate --config config/ema9_trend.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml --source yahoo \
#     --breakout SOXL --output artifacts/ema9_ema_invalid.json \
#     --report artifacts/ema9_ema_invalid.md
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml --timeframe 5m \
#     --source yahoo --breakout SOXL --output artifacts/ema9_ema_invalid_5m.json \
#     --report artifacts/ema9_ema_invalid_5m.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "15:15"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT
  - SOXL

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT, SOXL]
    cooldown_minutes: 60
    notes: "15m bullish EMA(9) cross while price holds above the 20-SMA and RSI is not overbought. Exit when a 15m bar closes < EMA9."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ema_invalid
      exit_ema_period: 9

  - id: ema9_cross_raw
    enabled: true
    symbols: [AAPL, MSFT, SOXL]
    cooldown_minutes: 60
    notes: "Ablation: 15m bullish EMA(9) cross with no SMA/RSI trend filter. Same 10-share EMA-invalidation exit."
    when:
      ema_cross:
        period: 9
        timeframe: 15m
        direction: bullish
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ema_invalid
      exit_ema_period: 9

  - id: engulfing-with-trend
    enabled: true
    symbols: [AAPL, MSFT, SOXL]
    cooldown_minutes: 60
    notes: "Control: 15m bullish engulfing while price holds above the 20-SMA and RSI is not overbought. Still uses 1.5/3.0 fixed brackets."
    when:
      all:
        - pattern: bullish_engulfing
          timeframe: 15m
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_loss_pct: 1.5
      take_profit_pct: 3.0
