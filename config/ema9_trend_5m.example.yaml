# Refined EMA9 day-trade on 5-minute bars — same long + short as ema9_trend.example.yaml.
#
# Identical except settings.timeframe / every condition is 5m. Cooldown stays
# 60 wall-clock minutes. Yahoo 5m history is capped at ~60 days.
#
# flatten_by 15:55 ET force-flats at the 15:50 ET 5m bar close (last 5m bar
# that completes at/before 15:55).
#
#   python -m dta_bot validate --config config/ema9_trend_5m.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml \
#     --compare-config config/ema9_trend_5m.example.yaml --source yahoo \
#     --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_lock_5m_vs_15m.json \
#     --report artifacts/ema9_lock_5m_vs_15m.md
#
# Equivalent: --config config/ema9_trend.example.yaml --timeframe 5m

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 5m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon long: 5m price crosses above EMA(9) while above SMA20 and RSI < 70. 10 shares, lock stop to +1% on first touch of entry×1.01, no take."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 5m
            direction: bullish
        - sma:
            period: 20
            timeframe: 5m
            compare: above
        - rsi:
            period: 14
            timeframe: 5m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_mode: lock_plus
      stop_loss_pct: 1.0
      lock_trigger_pct: 1.0
      lock_stop_pct: 1.0
  - id: ema9_trend_short
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon short: 5m price crosses below EMA(9) while below SMA20 and RSI > 30. 10 shares, lock stop to fill×0.99 on first touch of −1%, no take."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 5m
            direction: bearish
        - sma:
            period: 20
            timeframe: 5m
            compare: below
        - rsi:
            period: 14
            timeframe: 5m
            above: 30
    action:
      type: sell
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_mode: lock_plus
      stop_loss_pct: 1.0
      lock_trigger_pct: 1.0
      lock_stop_pct: 1.0
