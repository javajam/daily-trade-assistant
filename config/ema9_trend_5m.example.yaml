# 9 EMA trend on 5-minute bars — same rules as ema9_trend.example.yaml.
#
# Identical except settings.timeframe / every condition is 5m. Cooldown stays
# 60 wall-clock minutes (12 five-minute bars, not 4). Yahoo 5m history is
# capped at ~60 days; requesting more returns HTTP 422.
#
# Session gates (America/New_York): no new fills at/after 12:00; force-flat at
# the 15:50 ET 5m bar close (last 5m bar that completes at/before flatten_by 15:55).
# Prior cutoffs: 13:00 and 15:15 example YAMLs. Set entry_cutoff / flatten_by
# to null to restore overnight holds.
#
# Default exit is EMA-invalidation (close < EMA9 on a 5m bar, flatten at that
# close). Optional catastrophic stop_loss_pct is off. Entry is unchanged.
#
#   python -m dta_bot validate --config config/ema9_trend_5m.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend_5m.example.yaml --source yahoo \
#     --output artifacts/ema9_ema_invalid_5m.json \
#     --report artifacts/ema9_ema_invalid_5m.md
#
# Equivalent: --config config/ema9_trend.example.yaml --timeframe 5m
# Copy to config/ema9_trend_5m.yaml (gitignored) to paper-trade.

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 5m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "5m bullish EMA(9) cross while price holds above the 20-SMA and RSI is not overbought. Exit when a 5m bar closes < EMA9."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 5m
            direction: bullish
        - sma:
            period: 20
            timeframe: 5m
            compare: above
        - rsi:
            period: 14
            timeframe: 5m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ema_invalid
      exit_ema_period: 9

  - id: ema9_cross_raw
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Ablation: 5m bullish EMA(9) cross with no SMA/RSI trend filter. Same 10-share EMA-invalidation exit."
    when:
      ema_cross:
        period: 9
        timeframe: 5m
        direction: bullish
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ema_invalid
      exit_ema_period: 9

  - id: engulfing-with-trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Control: 5m bullish engulfing while price holds above the 20-SMA and RSI is not overbought. Still uses 1.5/3.0 fixed brackets."
    when:
      all:
        - pattern: bullish_engulfing
          timeframe: 5m
        - sma:
            period: 20
            timeframe: 5m
            compare: above
        - rsi:
            period: 14
            timeframe: 5m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_loss_pct: 1.5
      take_profit_pct: 3.0
