# 9/20 MA-cross on 5-minute bars — same rules as ema9_trend.example.yaml.
#
# Identical except settings.timeframe / every condition is 5m. Cooldown stays
# 60 wall-clock minutes. Yahoo 5m history is capped at ~60 days.
#
# Session gates (America/New_York) — toggle either to null / off:
#   entry_cutoff: "12:00"   # skip fills at/after this clock
#   flatten_by: "15:55"     # 5m force-flat at the 15:50 ET bar close
#
#   python -m dta_bot validate --config config/ema9_trend_5m.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend_5m.example.yaml --source yahoo \
#     --output artifacts/ema9_ma_cross_5m.json \
#     --report artifacts/ema9_ma_cross_5m.md
#
# Equivalent: --config config/ema9_trend.example.yaml --timeframe 5m

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 5m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "5m EMA(9) cross over SMA(20). Flatten next bar open on EMA(9) cross under SMA(20). 1.5% stop; no take-profit; no break-even."
    when:
      ema_sma_cross:
        ema_period: 9
        sma_period: 20
        timeframe: 5m
        direction: bullish
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross
      ema_period: 9
      sma_period: 20
      stop_loss_pct: 1.5
