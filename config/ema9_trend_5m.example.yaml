# Refined EMA9 day-trade on 5-minute bars — same locked range-expansion
# as ema9_trend.example.yaml.
#
# Identical rules; every indicator is computed on 5m bars with the same
# lengths as 15m (EMA 9, SMA 20, RSI 14). Not resampled from 15m.
# Range-expansion exit uses 5m high−low vs the prior three 5m bars.
# Cooldown stays 60 wall-clock minutes. Yahoo 5m history is capped at ~60 days.
#
# flatten_by 15:55 ET force-flats at the 15:50 ET 5m bar close (last 5m bar
# that completes at/before 15:55). Same-bar range_expansion + flatten →
# range_expansion (close-fill wins). Not armed on the entry/fill bar.
#
#   python -m dta_bot validate --config config/ema9_trend_5m.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml \
#     --compare-config config/ema9_trend_5m.example.yaml --source yahoo \
#     --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_range3_5m_vs_15m.json \
#     --report artifacts/ema9_range3_5m_vs_15m.md
#
# Equivalent: --config config/ema9_trend.example.yaml --timeframe 5m
# Writeup: artifacts/ema9_range3_5m_vs_15m.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 5m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book: 5m price crosses above EMA(9) while above SMA20 and RSI < 70. 10 shares, exit when bar range > max of previous 3, fill at that close. No percent stop."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 5m
            direction: bullish
        - sma:
            period: 20
            timeframe: 5m
            compare: above
        - rsi:
            period: 14
            timeframe: 5m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: range_expansion
      exit_range_bars: 3
