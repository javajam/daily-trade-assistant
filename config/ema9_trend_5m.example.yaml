# Refined EMA9 day-trade on 5-minute bars — same long-only MA-cross as
# ema9_trend.example.yaml.
#
# Identical except settings.timeframe / every condition is 5m. Cooldown stays
# 60 wall-clock minutes. Yahoo 5m history is capped at ~60 days.
#
# flatten_by 15:55 ET force-flats at the 15:50 ET 5m bar close (last 5m bar
# that completes at/before 15:55).
#
#   python -m dta_bot validate --config config/ema9_trend_5m.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend.example.yaml \
#     --compare-config config/ema9_trend_5m.example.yaml --source yahoo \
#     --combined-only --symbols AAPL,MSFT
#
# Equivalent: --config config/ema9_trend.example.yaml --timeframe 5m

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 5m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Noon book: 5m price crosses above EMA(9) while above SMA20 and RSI < 70. 10 shares, EMA9×below SMA20 exit at that bar's close, no percent stop."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 5m
            direction: bullish
        - sma:
            period: 20
            timeframe: 5m
            compare: above
        - rsi:
            period: 14
            timeframe: 5m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: ma_cross_close
      exit_ema_period: 9
      exit_sma_period: 20
