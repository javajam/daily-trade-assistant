# Refined EMA9 day-trade — 10-share book, universe TSLA / MU.
#
# Same noon stack + lock-+1% as config/ema9_trend.example.yaml
# (AAPL / MSFT default). Entry:
#
#   close crosses above EMA(9) AND close > SMA(20) AND RSI(14) < 70
#   Fill at the next bar open.
#
# Session gates: entry_cutoff 12:00 ET, flatten_by 15:55 ET.
# Stop: lock_plus — initial fill×0.99; first touch of fill×1.01 locks
# the stop to fill×1.01 (live next bar). No take-profit.
# 1% equity-risk sibling: config/ema9_trend_risk_tsla_mu.example.yaml
#
#   python -m dta_bot validate --config config/ema9_trend_tsla_mu.example.yaml
#   python -m dta_bot backtest --config config/ema9_trend_tsla_mu.example.yaml \
#     --compare-config config/ema9_trend_risk_tsla_mu.example.yaml \
#     --compare-config config/ema9_trend.example.yaml \
#     --compare-config config/ema9_trend_risk.example.yaml \
#     --source yahoo --combined-only \
#     --output artifacts/ema9_tsla_mu_15m.json \
#     --report artifacts/ema9_tsla_mu_15m.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"   # null / off disables
  flatten_by: "15:55"     # null / off disables

universe:
  - TSLA
  - MU

rules:
  - id: ema9_trend
    enabled: true
    symbols: [TSLA, MU]
    cooldown_minutes: 60
    notes: "Noon book on TSLA/MU: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 10 shares, lock stop to +1% on first touch of entry×1.01, no take."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: fixed_bracket
      stop_mode: lock_plus
      stop_loss_pct: 1.0
      lock_trigger_pct: 1.0
      lock_stop_pct: 1.0
