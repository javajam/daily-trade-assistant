# A — no-noon locked book, hard 1% fill stop (stop-only A/B/C baseline).
#
# Same entry / range>last-3 / 10-share as the locked book, but entry_cutoff is
# off (fills after noon are allowed). Flatten still 15:55 ET. Range expansion
# skips doji bars (body/range <= 0.10). Protective stop is fill × 0.99
# (stop_mode: entry_pct); never moves. Not lock_plus.
# Writeup: artifacts/ema9_atr_stop_ab.md
#
#   python -m dta_bot backtest \
#     --config config/ema9_trend_bracket_nobe_range3_fixed1_nocutoff.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_range3_atr1.example.yaml \
#     --compare-config config/ema9_trend_bracket_nobe_range3_atr15.example.yaml \
#     --source yahoo --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_atr_stop_ab.json \
#     --report artifacts/ema9_atr_stop_ab.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: null
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT
  - SOXL

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT, SOXL]
    cooldown_minutes: 60
    notes: "No-noon book: 15m price crosses above EMA(9) while above SMA20 and RSI < 70. 10 shares, hard 1% fill stop plus range>last-3 (skip doji). Not lock_plus."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: shares
        value: 10
      order: market
      exit: range_expansion
      exit_range_bars: 3
      exit_range_skip_doji: true
      exit_range_doji_frac: 0.10
      stop_mode: entry_pct
      stop_loss_pct: 1.0
