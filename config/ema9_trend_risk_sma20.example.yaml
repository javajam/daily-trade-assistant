# Prior noon day-trade book — old entry, 1% equity-risk, SMA(20) stop + 2% take.
#
# Same locked stack as config/ema9_trend_risk_nobe_12.example.yaml except
# stop_mode: sma20. R for share calc is signal-bar close minus SMA20
# (distance entry-reference → SMA20 stop). No percent stop_pct.
# When R is a few cents/dollars (close just above SMA20), 1% equity risk
# sizes more shares than $100k cash can buy — those signals skip.
#
# Control (1.0/2.0 percent): config/ema9_trend_risk_nobe_12.example.yaml
# No-take sibling: config/ema9_trend_risk_sma20_notake.example.yaml
#
#   python -m dta_bot backtest --config config/ema9_trend_risk_nobe_12.example.yaml \
#     --compare-config config/ema9_trend_risk_sma20.example.yaml \
#     --compare-config config/ema9_trend_risk_sma20_notake.example.yaml \
#     --source yahoo --start 2026-08-01 --end 2026-08-31 \
#     --combined-only --symbols AAPL,MSFT \
#     --output artifacts/ema9_aug2026_risk_sma20.json \
#     --report artifacts/ema9_aug2026_risk_sma20.md

settings:
  paper: true
  allow_live: false
  dry_run: true
  poll_interval_seconds: 60
  kill_switch_file: data/KILL
  state_file: data/state.json
  max_open_positions: 5
  data_feed: iex
  lookback_bars: 80
  timeframe: 15m
  session_timezone: America/New_York
  entry_cutoff: "12:00"
  flatten_by: "15:55"

universe:
  - AAPL
  - MSFT

rules:
  - id: ema9_trend
    enabled: true
    symbols: [AAPL, MSFT]
    cooldown_minutes: 60
    notes: "Prior noon book: 15m price crosses EMA(9) while above SMA20 and RSI < 70. 1% equity risk at SMA20 signal-bar stop; 2.0% take. No break-even."
    when:
      all:
        - ema_cross:
            period: 9
            timeframe: 15m
            direction: bullish
        - sma:
            period: 20
            timeframe: 15m
            compare: above
        - rsi:
            period: 14
            timeframe: 15m
            below: 70
    action:
      type: buy
      size:
        type: risk_pct
        equity_risk: 0.01
      order: market
      exit: fixed_bracket
      stop_mode: sma20
      stop_sma_period: 20
      take_profit_pct: 2.0
