[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-trade-assistant"
version = "0.1.0"
description = "Personal trade journal plus an Alpaca paper-trading rules bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dta-bot = "dta_bot.cli:main"

[tool.setuptools.packages.find]
include = ["dta_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
